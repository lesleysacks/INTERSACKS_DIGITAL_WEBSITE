<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Valentine Card Template</title>
  <style>
    :root{--rose:#e93868;--red:#a80f3d;--blush:#fff0f4;--cream:#fffaf4;--ink:#421428;--focus:#005fcc;color-scheme:light}*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{min-height:100vh;display:grid;place-items:center;padding:28px 16px;background:radial-gradient(circle at top,#fff 0,var(--blush) 38%,#ffc4d3 100%);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
    main,.layout,.layout>*,section{min-width:0}main{position:relative;width:min(920px,100%);padding:clamp(24px,5vw,58px);border:2px solid var(--red);border-radius:30px;background:rgba(255,250,244,.94);box-shadow:0 24px 70px rgba(117,14,48,.2);overflow:hidden}.layout{display:grid;grid-template-columns:minmax(220px,.8fr) minmax(0,1.2fr);gap:clamp(28px,6vw,68px);align-items:center}.visual{aspect-ratio:1;display:grid;place-items:center;border:1px solid #e89aae;border-radius:50%;background:linear-gradient(145deg,#ffd3df,#fff);overflow:hidden}.visual img{width:100%;height:100%;object-fit:cover}.placeholder{font-size:clamp(70px,13vw,128px);filter:drop-shadow(0 10px 16px rgba(168,15,61,.18))}.eyebrow{margin:0 0 12px;color:var(--red);font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}h1{margin:0;overflow-wrap:anywhere;font-family:Georgia,serif;font-size:clamp(42px,7vw,76px);line-height:1;color:var(--red)}.question{margin:24px 0 20px;font-size:clamp(20px,3vw,29px);line-height:1.35}.actions{display:flex;flex-wrap:wrap;gap:12px}.actions button{min-height:48px;padding:12px 22px;border:2px solid var(--red);border-radius:999px;background:var(--red);color:#fff;font:800 14px/1 system-ui,sans-serif;cursor:pointer}.actions .secondary{background:transparent;color:var(--red)}button:hover{transform:translateY(-2px)}button:focus-visible{outline:4px solid var(--focus);outline-offset:4px}.response{min-height:58px;margin:22px 0 0;padding:15px 17px;border-left:4px solid var(--rose);background:#fff;color:var(--ink);line-height:1.55}.signature{margin:18px 0 0;color:var(--red);font-family:Georgia,serif;font-size:20px;font-style:italic}.hearts{position:fixed;inset:0;overflow:hidden;pointer-events:none}.hearts i{position:absolute;bottom:-30px;color:var(--rose);font-style:normal;animation:float 2.6s ease-in forwards}@keyframes float{to{transform:translateY(-110vh) rotate(24deg);opacity:0}}@media(max-width:700px){body{display:block;padding:12px 9px}main{margin:auto;padding:30px 22px;border-radius:20px}.layout{grid-template-columns:minmax(0,1fr);text-align:center}.visual{width:min(260px,72vw);max-width:100%;margin:auto}.actions{justify-content:center}.response{text-align:left}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}button:hover{transform:none}}
  </style>
</head>
<body>
  <main aria-labelledby="card-title"><div class="layout"><div class="visual" id="visual"><span class="placeholder" id="placeholder" role="img" aria-label="Decorative heart placeholder">💗</span></div><section><p class="eyebrow">A Valentine for</p><h1 id="card-title"></h1><p class="question" id="question"></p><div class="actions"><button id="positive" type="button"></button><button class="secondary" id="secondary" type="button"></button></div><p class="response" id="response" role="status" aria-live="polite">Choose whichever answer feels right.</p><p class="signature" id="signature"></p></section></div></main><div class="hearts" id="hearts" aria-hidden="true"></div>
  <script>
    // === CUSTOMIZE YOUR CARD HERE: edit only the values in CARD_CONFIG. ===
    const CARD_CONFIG = {pageTitle:'A Valentine for Someone Special',recipientName:'Someone Special',photoUrl:'',photoAlt:'A favorite shared memory',question:'Would you like to be my Valentine?',positiveButtonLabel:'Yes ❤️',secondaryButtonLabel:'Maybe 😊',positiveResponse:'Wonderful! You just made this Valentine extra bright.',secondaryResponse:'No pressure at all — you are appreciated either way.',signature:'With affection, Your Name'};
    const byId=(id)=>document.getElementById(id);document.title=CARD_CONFIG.pageTitle;byId('card-title').textContent=CARD_CONFIG.recipientName;byId('question').textContent=CARD_CONFIG.question;byId('positive').textContent=CARD_CONFIG.positiveButtonLabel;byId('secondary').textContent=CARD_CONFIG.secondaryButtonLabel;byId('signature').textContent=CARD_CONFIG.signature;
    if(CARD_CONFIG.photoUrl){const img=document.createElement('img');img.alt=CARD_CONFIG.photoAlt;img.addEventListener('load',()=>{byId('visual').textContent='';byId('visual').append(img);});img.addEventListener('error',()=>{byId('response').textContent='The optional photo could not load, so the heart placeholder remains.';});img.src=CARD_CONFIG.photoUrl;}
    const reduced=matchMedia('(prefers-reduced-motion: reduce)');function celebrate(){if(reduced.matches)return;const box=byId('hearts');box.textContent='';for(let i=0;i<18;i++){const heart=document.createElement('i');heart.textContent='♥';heart.style.left=(Math.random()*100)+'%';heart.style.fontSize=(18+Math.random()*24)+'px';heart.style.animationDelay=(Math.random()*.5)+'s';box.append(heart);}setTimeout(()=>{box.textContent='';},3200)}
    function respondPositive(){byId('response').textContent=CARD_CONFIG.positiveResponse;celebrate()}function respondSecondary(){byId('response').textContent=CARD_CONFIG.secondaryResponse}byId('positive').addEventListener('click',respondPositive);byId('secondary').addEventListener('click',respondSecondary);[[byId('positive'),respondPositive],[byId('secondary'),respondSecondary]].forEach(([button,action])=>button.addEventListener('keydown',(event)=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();action();}}));
  </script>
</body>
</html>
